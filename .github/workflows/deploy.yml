name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code and booking rules
        run: |
          npm run lint
          npm test

      - name: Test migrations, booking storage and delivery on the fresh runner
        shell: bash
        run: |
          docker network create --driver bridge --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 muba-site-local
          npx --yes supabase@3.2.0 start --network-id muba-site-local -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor >/dev/null
          for suite in calendar-sync booking-email ride-storage intake-limits; do
            npx --yes supabase@3.2.0 status -o json | node "supabase/tests/$suite.mjs"
          done
          docker exec -i supabase_db_muba-site psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/work-hours.sql
          npx --yes supabase@3.2.0 db advisors --level warn --fail-on warn

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node -e "if (new URL(process.env.VITE_SUPABASE_URL).protocol !== 'https:' || !/^sb_publishable_.+/.test(process.env.VITE_SUPABASE_PUBLISHABLE_KEY)) throw new Error('Set the hosted Supabase URL and publishable key in the github-pages environment')"
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
